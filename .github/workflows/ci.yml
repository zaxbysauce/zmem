name: CI

# Runs the full test suite on pull requests and on pushes to main (pushes to
# other branches are covered by their PR's run). The test/ test-embeddings/
# test-source-hermes jobs run MODEL-ABSENT (skills/memory/models/minilm.onnx
# is gitignored — Phase 10, PLAN.md §7-P10; ZMEM_MODEL_AUTODOWNLOAD=0
# guarantees no lazy-download): recall degrades to FTS5, consolidate degrades
# to lexical token-overlap clustering — see skills/memory/scripts/embeddings.py
# and store.py's `consolidate`. The ONE deliberate exception is the
# test-real-model job (issue #413): it fetches the pinned bytes from the
# model-minilm-bbd7b466 release asset, sha-verifies them against the in-repo
# pin, and runs the #376 contract's real-model legs natively.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# A new push to a PR supersedes the in-flight PR run, so cancel it. Only
# pull_request runs are cancellable: pushes to main must always run to
# completion (the release drift gate below polices every main merge). Non-PR
# runs key on run_id, not the ref: even with cancel-in-progress off, a shared
# group keeps only ONE pending run, so two quick merges to main would silently
# drop the drift gate for the middle commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Successful-run durations 2026-09-29..10-18: windows max 151 min (median
    # 58, p95 78, next-highest 104); ubuntu max 26 min. ubuntu gets 60 (>2x
    # its max) so a hung leg fails in an hour; every other label, Windows
    # included, gets 240 (1.5x the Windows max, rounded up), so a renamed
    # runner label falls back to the generous bound, never the tight one.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 60 || 240 }}
    # Least-privilege token scope (#37 L13). This workflow runs on push/PR
    # (never pull_request_target), uses no secrets, and only needs to read the
    # repo to check it out — so scope the GITHUB_TOKEN to read-only. `actions:
    # read` is included so a future `cache:` directive on setup-python/setup-
    # node does not silently fail (cache-key resolution needs it).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Never attempt to download the 90MB model in CI — the whole point of
      # this job is proving the suites pass in degraded (no-embeddings) mode.
      ZMEM_MODEL_AUTODOWNLOAD: "0"
    steps:
      # Actions are tag-pinned. This workflow uses no secrets and no
      # pull_request_target, so the threat model for tag-repointing is low
      # (the GITHUB_TOKEN is read-only above and nothing exfiltratable is
      # produced). SHA-pinning would add a manual-update burden with little
      # marginal gain here; revisit if secrets or pull_request_target are added.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 2 (not the default 1) so the release drift gate below can
          # compare HEAD's manifest versions against HEAD~1 (issue #106).
          # release.yml keeps its own fetch-depth: 0 — this change is
          # ci.yml-only.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The refresh-report schema is a release contract.  Install its
      # validator explicitly so the schema assertions in the Python suites
      # cannot silently take the optional-dependency skip path. pytest is
      # installed too: the deepseek harness (tests/support/deepseek_harness.py)
      # uses pytest.skip semantics for its runtime-unavailable legs, and
      # without it the t13/t14 suites die with ModuleNotFoundError instead
      # of running (PR #409 review blocker 3).
      - name: Install report schema validator
        shell: bash
        run: python -m pip install --disable-pip-version-check "jsonschema>=4,<5" "pytest>=8"

      # Issue #159 (Workstream H-2): the MCP transport is a first-class
      # passive lane — install its declared requirements in BOTH matrix jobs
      # so the mcp-gated suites RUN instead of silently skipping (the
      # historical skip-when-absent CI blind spot, closed at the source).
      - name: Install MCP server requirements
        shell: bash
        run: python -m pip install --disable-pip-version-check -r hermes-plugin/server/requirements.txt


      # Issue #134 (Workstream E): tests/test_dataset.py exercises the
      # governed dataset artifact layer, which fails closed without pyarrow
      # (export is parquet-only). Install it in BOTH matrix legs so the
      # dataset suite RUNS instead of erroring.
      - name: Install pyarrow
        shell: bash
        run: python -m pip install --disable-pip-version-check -r skills/memory/scripts/requirements-training.txt

      # Issue #134 follow-up: tests/test_dataset.py::test_hub_client_maps_
      # conflict_and_notfound constructs the real HubDatasetClient (its
      # __init__ imports huggingface_hub; the API itself is stubbed), so
      # the dependency must be present for the path to stay exercised.
      - name: Install huggingface_hub
        shell: bash
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.30"

      # Issue #180: the legacy-import capture fixture carries a memory_vec
      # carrier, and import-store refuses (fail-closed) to sanitize a
      # vec-bearing store without the sqlite-vec extension — stale
      # pre-redaction vectors are exactly the leak the carrier exists to
      # catch. Install the small extension in BOTH matrix legs so the
      # import suite RUNS its vec path instead of erroring; the heavier
      # embedding model runtime stays reserved for the test-embeddings job.
      - name: Install sqlite-vec
        shell: bash
        run: python -m pip install --disable-pip-version-check "sqlite-vec>=0.1.6,<1.0"

      - name: Install pinned dsh runtime (npm ci)
        # issues #374/#375: the t13/t14 runtime legs exercise the real
        # @deepseek-ai 0.2.1-rc.2 packages; the committed lockfile pins the
        # versions and node_modules stays gitignored. Requires the Node 22
        # pinned above (cordis uses Promise.withResolvers).
        shell: bash
        run: |
          if [ -f deepseek-plugin/package-lock.json ]; then
            npm ci --prefix deepseek-plugin --no-audit --no-fund
          else
            echo "deepseek-plugin lockfile absent; runtime legs will skip"
          fi
      - name: MCP tool suites (skipped=0 gate)
        shell: bash
        run: |
          set -e
          out="$(python -m unittest -v tests/test_session_tools.py tests/test_mcp_server.py tests/test_evidence_association.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq 'skipped=[1-9]'; then
            echo "::error::MCP suites reported skips — the mcp dependency must be installed and exercised on every matrix leg (issue #159)"
            exit 1
          fi
          echo "mcp suites green; skipped=0"

      # Issue #285 (Workstream T PR 6): the hello-handshake checks are
      # module-level pytest functions with a __main__ runner, so they run in
      # the direct-execution python lane — but that lane's skip path exits 0
      # ungated. Run them here (post requirements install) and fail loudly
      # on the visible SKIP, closing the #159 blind spot for this file.
      - name: MCP hello-handshake checks (skip-guarded)
        shell: bash
        run: |
          set -e
          out="$(python tests/test_t06_hello.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq '^SKIP:'; then
            echo "::error::tests/test_t06_hello.py skipped — the mcp dependency must be installed and exercised on every matrix leg (issues #159/#285)"
            exit 1
          fi
          out="$(python tests/test_t06_hello_fb.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq '^SKIP:'; then
            echo "::error::tests/test_t06_hello_fb.py skipped — the mcp dependency must be installed and exercised on every matrix leg (issues #159/#285)"
            exit 1
          fi
          echo "t06 hello-handshake checks green (base + feedback)"

      # Issue #286 (Workstream T PR 7): same guard for the deadline checks —
      # the frozen acceptance file + the supp file both SKIP without mcp.
      - name: MCP deadline checks (skip-guarded)
        shell: bash
        run: |
          set -e
          out="$(python tests/test_t07_deadline.py 2>&1)" || {
            printf '%s' "$out"
            exit 1
          }
          printf '%s' "$out"
          out2="$(python tests/test_t07_deadline_supp.py 2>&1)" || {
            printf '%s' "$out2"
            exit 1
          }
          printf '%s' "$out2"
          if printf '%s' "$out" | grep -Eq '^SKIP:' || printf '%s' "$out2" | grep -Eq '^SKIP:'; then
            echo "::error::t07 deadline checks skipped — the mcp dependency must be installed and exercised on every matrix leg (issues #159/#286)"
            exit 1
          fi
          echo "t07 deadline checks green (frozen + supp)"

      # Issue #287 (Workstream T PR 8): the broker checks span the python
      # lane (frozen C2-C4 + the supp file, both SKIP without mcp) and the
      # node lane (frozen C1 drives the real launcher against a real hub).
      - name: Fleet broker checks (skip-guarded)
        shell: bash
        run: |
          set -e
          out="$(python tests/test_t08_broker_events.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if [ -f tests/test_t08_broker_supp.py ]; then
            out2="$(python tests/test_t08_broker_supp.py 2>&1)" || {
              printf '%s\n' "$out2"
              exit 1
            }
            printf '%s\n' "$out2"
          else
            out2=""
          fi
          if printf '%s\n' "$out" | grep -Eq '^SKIP:' || printf '%s\n' "$out2" | grep -Eq '^SKIP:'; then
            echo "::error::t08 broker checks skipped — the mcp dependency must be installed and exercised on every matrix leg (issues #159/#287)"
            exit 1
          fi
          echo "t08 broker python checks green (frozen + supp)"

      # Issue #288 (Workstream T PR 9): the op-queue checks are python-only
      # (frozen C1-C6 + supp) and SKIP without mcp — guarded like t06-t08.
      - name: Fleet op-queue checks (skip-guarded)
        shell: bash
        run: |
          set -e
          out="$(python tests/test_t09_op_queue.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if [ -f tests/test_t09_op_queue_supp.py ]; then
            out2="$(python tests/test_t09_op_queue_supp.py 2>&1)" || {
              printf '%s\n' "$out2"
              exit 1
            }
            printf '%s\n' "$out2"
          else
            out2=""
          fi
          if printf '%s\n' "$out" | grep -Eq '^SKIP:' || printf '%s\n' "$out2" | grep -Eq '^SKIP:'; then
            echo "::error::t09 op-queue checks skipped — the mcp dependency must be installed and exercised on every matrix leg (issues #159/#288)"
            exit 1
          fi
          echo "t09 op-queue checks green (frozen + supp)"

      # Issue #291 (Workstream T PR 12): the fleet-operator checks are
      # module-level pytest functions with a __main__ runner (added after
      # review found CI executed zero assertions from them). Three detectors,
      # each proving one thing: (1) `import mcp` gates the dependency is
      # installed on the leg; (2) the SKIP scan proves an mcp-missing skip
      # cannot hide behind exit 0 — with ONE test-scoped exemption,
      # test_installer_statics, whose bash probe legitimately skips on
      # Windows runners (`bash` resolves to the non-functional WSL stub);
      # (3) the PASS pins prove the transport-exercising tests ran green
      # rather than silently doing nothing (issues #159/#291).
      - name: Fleet operator checks (skip-guarded)
        shell: bash
        run: |
          set -e
          python -c "import mcp" || {
            echo "::error::t12: the mcp dependency is not importable on this leg (issues #159/#291)"
            exit 1
          }
          out="$(python tests/test_t12_fleet_ops.py 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          out2="$(python tests/test_t12_fleet_ops_supp.py 2>&1)" || {
            printf '%s\n' "$out2"
            exit 1
          }
          printf '%s\n' "$out2"
          nonsanctioned="$(printf '%s\n%s\n' "$out" "$out2" | grep -E '^SKIP:' | grep -v '^SKIP: test_installer_statics' || true)"
          if [ -n "$nonsanctioned" ]; then
            printf '%s\n' "$nonsanctioned"
            echo "::error::t12 fleet operator checks skipped - the mcp dependency must be exercised on every matrix leg (issues #159/#291)"
            exit 1
          fi
          out3="$(python tests/test_t12_map_perms.py 2>&1)" || {
            printf '%s\n' "$out3"
            echo "::error::t12 map-permission driver (doctor leg) failed - the fleet-principal lane must fail an over-permissive map on every matrix leg (issue #406)"
            exit 1
          }
          printf '%s\n' "$out3"
          out4="$(python tests/test_t12_map_perms.py --hub-refusal 2>&1)" || {
            printf '%s\n' "$out4"
            echo "::error::t12 map-permission driver (hub refusal leg) failed - the hub must refuse an over-permissive map at load and reload on every matrix leg (issue #406)"
            exit 1
          }
          printf '%s\n' "$out4"
          for t in test_doctor_fleet_checks_present \
                   test_hello_real_transport_401_is_a_failure \
                   test_broker_credential_file_resolves_through_transport \
                   test_hermes_store_config_refusal_propagates; do
            if ! printf '%s\n%s\n' "$out" "$out2" | grep -q "^PASS $t\$"; then
              echo "::error::t12 fleet operator checks: '$t' did not PASS (issues #159/#291)"
              exit 1
            fi
          done
          echo "t12 fleet operator checks green (frozen + supp)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22: the dsh/cordis 0.2.1-rc.2 runtime used by the deepseek
          # scenario legs requires Promise.withResolvers (Node >= 22);
          # node 20 is deprecated on the runners anyway.
          node-version: "22"

      - name: Confirm model is absent (sanity check for the degraded-mode guarantee)
        shell: bash
        run: |
          if [ -f skills/memory/models/minilm.onnx ]; then
            echo "::error::minilm.onnx should be gitignored and absent in a fresh checkout"
            exit 1
          fi
          echo "minilm.onnx absent, as expected — suites must pass in degraded mode."

      - name: Run Python test suites
        shell: bash
        run: |
          set -e
          for f in tests/test_*.py; do
            # Issue #77: the sqlite-vec smoke test has NO skip guard — it needs
            # the embedding requirements and is exercised by the dedicated
            # test-embeddings job, not this model-absent loop.
            if [ "$f" = "tests/test_embeddings_ci.py" ]; then
              echo "=== $f (skipped here: dependency-enforcing smoke test runs in test-embeddings) ==="
              continue
            fi
            # (Issue #256 gate removed: #180 landed, so the full
            # test_q02_passive_secret_withhold.py file — AC6 class included —
            # runs in this loop.)
            echo "=== $f ==="
            python "$f"
          done

      # Issue #108: post-install canary in deterministic --self-test mode —
      # seeds an isolated scratch store, drives the SessionStart hook chain,
      # and asserts the decision line carries the seeded row (plus the #107
      # drift status). No host binaries, no network, no model. The live-mode
      # lanes (claude -p / codex exec) are operator-run; absent host binaries
      # take the exit-0 skip path by design.
      - name: Host injection canary (self-test)
        shell: bash
        run: |
          set -e
          python scripts/host_canary.py --host claude --self-test
          python scripts/host_canary.py --host codex --self-test

      # Issues #107/#325/#354/#359: the PR-time release gate verifies the
      # committed release-manifest.json on EVERY run (equal versions are the
      # sibling-collision state, not a benign skip), fails a version that is
      # already tagged (collision) or below the newest tag (ordering) when
      # the PR claims a release target, and fails closed on indeterminate
      # version reads. The PR checkout is shallow and carries no origin/main
      # ref, so the step fetches the base tip explicitly (depth-1 suffices:
      # the gate reads only git show <ref>:<manifest> per tracked version
      # surface); --tags (not the old --no-tags) also materializes the tag
      # universe the collision/ordering check reads — without it that check
      # is structurally vacuous in CI.
      - name: Manifest freshness (release gate)
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        run: |
          git fetch --tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          python scripts/release_gate.py --check-manifest-freshness --base origin/main

      # Issue #106 (P0-1, durable half): fail a merge to main that leaves
      # content under ## [Unreleased] without a version bump at HEAD — the
      # exact 8-merge static-0.13.1 stall (PRs #86–#104). PR runs skip the
      # step: it polices the merge-to-main state, where HEAD~1 is the prior
      # main tip (a PR checkout's HEAD~1 is branch history, meaningless for
      # the bump comparison). Escape: "[skip release]" in the merge subject.
      # !cancelled(): the gate must run even when an earlier step failed —
      # a red build must not also mute the drift check on a main push.
      - name: Release drift gate (main pushes only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: python scripts/release_gate.py --check-unreleased-drift

      # Issue #64, 9.5: offline eval against the fixture gold set, using the
      # SAME command SKILL.md documents (scripts/eval_runner.py). Model-absent
      # by construction (fake embedder, ZMEM_TEST_NOW-pinned). The report is
      # collected as an artifact; the score never gates the build (no
      # --fail-under) and nothing is downloaded.
      - name: Run offline eval (model-absent, fake profile)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ZMEM_EMBED_PROFILE: fake
        run: |
          set -e
          python scripts/eval_runner.py --store .eval-tmp/store.sqlite --gold eval/gold.jsonl --json-out .eval-tmp/eval-results.json

      - name: Upload eval report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}
          path: .eval-tmp/eval-results.json
          if-no-files-found: warn

      # Issue #155/#183: replay the committed, read-only decision snapshot on
      # every platform leg.  This is a measurement/audit gate, not a live
      # efficacy claim; empty observation denominators remain explicit zero
      # compatibility values in the report.
      - name: Run deterministic replay audit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          mkdir -p .eval-tmp
          python scripts/eval_replay.py \
            --store tests/fixtures/replay/store.sqlite \
            --log tests/fixtures/replay/decisions.log \
            --days 30 \
            --compare-baseline eval/baseline-replay.json \
            --json-out .eval-tmp/replay-results.json

      - name: Upload replay report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-results-${{ matrix.os }}
          path: .eval-tmp/replay-results.json
          if-no-files-found: warn

      # Issue #111: the injection-direction precision gold — the REAL
      # for-injection lane (gate + token budget) scored on the rendered set,
      # with negative controls. Record-only, same as the eval above: the
      # score never gates the build (no --fail-under-*, no
      # --compare-baseline) and nothing is downloaded. The committed
      # baseline (eval/baseline-injection.json) is what later phases diff
      # against; flipping this to a gate is ONE flag.
      - name: Run injection eval (model-absent, fake profile)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ZMEM_EMBED_PROFILE: fake
        run: |
          set -e
          python scripts/eval_inject_runner.py --store .eval-tmp/store.sqlite --gold eval/injection_gold.jsonl --json-out .eval-tmp/eval-inject-results.json

      # Issue #157: the counterfactual A/B replay — the committed five-session
      # task set with and without memory through the pinned recorded-stub-v1
      # path. The stub report must be byte-identical to the committed oracle,
      # the report must validate against eval/counterfactual-schema.json, and
      # a real-model id must take the exact skip path without any model call.
      # The generator is a developer-side tool; CI never regenerates.
      - name: Run counterfactual stub replay and verify oracle bytes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          scratch="$(mktemp -d)"
          export ZMEM_STORE="$scratch/ambient.sqlite" ZMEM_DATA="$scratch" \
            ZMEM_MODELS_DIR="$scratch/missing-models" ZMEM_MODEL_AUTODOWNLOAD=0 \
            ZMEM_EMBED_PROFILE=fake ZMEM_TEST_NOW=2026-06-01T00:00:00Z PYTHONUTF8=1
          python scripts/eval_counterfactual.py \
            --tasks tests/fixtures/counterfactual/tasks.json \
            --store tests/fixtures/counterfactual/store.sqlite \
            --model-id recorded-stub-v1 \
            --json-out "$scratch/counterfactual.json"
          cmp tests/fixtures/counterfactual/expected.json "$scratch/counterfactual.json"

      - name: Validate counterfactual schema (Draft 2020-12)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          python -m json.tool eval/counterfactual-schema.json > /dev/null
          python - <<'PY'
          import json
          import jsonschema
          schema = json.load(open("eval/counterfactual-schema.json", encoding="utf-8"))
          report = json.load(open("tests/fixtures/counterfactual/expected.json", encoding="utf-8"))
          jsonschema.validate(report, schema)
          print("counterfactual schema: OK")
          PY

      - name: Assert counterfactual real-model skip path
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          scratch="$(mktemp -d)"
          export ZMEM_STORE="$scratch/ambient.sqlite" ZMEM_DATA="$scratch" \
            ZMEM_MODELS_DIR="$scratch/missing-models" ZMEM_MODEL_AUTODOWNLOAD=0 PYTHONUTF8=1
          output="$(python scripts/eval_counterfactual.py \
            --tasks tests/fixtures/counterfactual/tasks.json \
            --store tests/fixtures/counterfactual/store.sqlite \
            --model-id real-model-v1)"
          printf '%s\n' "$output" | grep -Fx "SKIPPED: model calls disabled"

      - name: Upload injection eval report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-inject-results-${{ matrix.os }}
          path: .eval-tmp/eval-inject-results.json
          if-no-files-found: warn

      - name: Run Node test suites
        # !cancelled(): the eval step above can fail operationally (exit 2) — a
        # JS-coverage blackout on one matrix leg must not be its side effect.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e
          for f in tests/test_*.js; do
            echo "=== $f ==="
            node "$f"
          done

  # Issue #77: dependency-enforcing vector lane. This job installs the
  # embedding requirements (sqlite-vec included) and runs the NON-SKIPPING
  # smoke test, so a missing or broken vector dependency fails CI instead of
  # silently degrading to FTS5-only recall. The model-absent `test` job
  # excludes tests/test_embeddings_ci.py from its loop for the same reason.
  test-embeddings:
    name: test-embeddings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Successful-run max 3.7 min (windows), 1.3 min (ubuntu); 15 = floor
    # covering pip/install variance.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # No model download here either — the smoke test uses the deterministic
      # fake profile embedder, so this lane proves the sqlite-vec dependency,
      # not the ONNX model.
      ZMEM_MODEL_AUTODOWNLOAD: "0"
      ZMEM_EMBED_PROFILE: "fake"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install embedding requirements (declares sqlite-vec)
        shell: bash
        run: python -m pip install --disable-pip-version-check -r hermes-plugin/server/requirements-embeddings.txt
      - name: Run sqlite-vec / fake-profile smoke test (no skip)
        shell: bash
        run: |
          set -e
          python -m unittest -v tests/test_embeddings_ci.py
      - name: Run vec-gated suites under sqlite-vec (issue #77)
        # These suites hand-craft minilm-shaped (384-dim) vectors, so they
        # need the DEFAULT embed profile's column dimension — the job-level
        # ZMEM_EMBED_PROFILE=fake (16-dim) is scoped to the smoke step above.
        env:
          ZMEM_EMBED_PROFILE: ""
        shell: bash
        run: |
          set -e
          python -m unittest -v tests/test_consolidate_namespace.py tests/test_consolidate_contested.py tests/test_reembed.py tests/test_purge_vec.py tests/test_rekey_namespace_adversarial.py tests/test_rekey_namespace_map.py

  # Issue #413 (AC6): the provisioned-model lane. The #376 subject-dedup
  # contract's five real-model legs are MODEL_UNAVAILABLE/INCOMPLETE on every
  # model-absent lane by design; NATIVE approval of those legs requires a
  # checksum-verified pinned model (tests/test_subject_dedup_contract.py
  # docstring, frozen in the #376 checkpoint). This job provisions the pinned
  # bytes from the never-retargeted model-minilm-bbd7b466 release asset,
  # sha-verifies
  # them against the in-repo pin ON EVERY RUN (cache hits included), and runs
  # the seven frozen pytest argvs. Runs on every PR — no path filter — so the
  # lane can never skip its own introducing changes.
  test-real-model:
    name: test-real-model
    runs-on: ubuntu-latest
    # Cold cache: ~90MB fetch + five real-model driver executions (each
    # subprocess re-runs the driver; its cache is process-local). 25 covers
    # cold-fetch variance; warm runs finish well under 10.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      ZMEM_MODEL_AUTODOWNLOAD: "0"
      ZMEM_MODELS_CACHE: ${{ github.workspace }}/.models-cache
    steps:
      - uses: actions/checkout@v4
        with:
          # skills/memory/models/tokenizer.json is a Git LFS object; a plain
          # checkout materializes the 131-byte pointer file instead of the
          # 711,661-byte JSON, and tokenizers rejects the pointer with
          # "expected value at line 1 column 1" (CI round 4 diagnosis).
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install embedding requirements + pytest
        shell: bash
        run: python -m pip install --disable-pip-version-check -r hermes-plugin/server/requirements-embeddings.txt pytest
      - name: Restore models dir cache (keyed on the pin)
        uses: actions/cache@v4
        with:
          path: ${{ env.ZMEM_MODELS_CACHE }}
          key: minilm-bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
      - name: Provision pinned model (download if absent; verify EVERY run)
        shell: bash
        run: |
          set -e
          mkdir -p "$ZMEM_MODELS_CACHE"
          if [ ! -f "$ZMEM_MODELS_CACHE/minilm.onnx" ]; then
            echo "cache miss: fetching pinned bytes from the release asset"
            curl -fsSL --retry 3 -o "$ZMEM_MODELS_CACHE/minilm.onnx" \
              "https://github.com/zaxbysauce/zmem/releases/download/model-minilm-bbd7b466/minilm.onnx"
          else
            echo "cache hit: re-verifying cached bytes"
          fi
          python - <<'PY'
          import hashlib, os, sys
          sys.path.insert(0, os.path.join("skills", "memory", "scripts"))
          import embed_profiles
          pin = embed_profiles.MINILM_SHA256
          cache = os.environ["ZMEM_MODELS_CACHE"]
          p = os.path.join(cache, "minilm.onnx")
          h = hashlib.sha256()
          with open(p, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          digest = h.hexdigest()
          if digest != pin:
              print(f"FATAL: cached/downloaded minilm.onnx sha256 {digest} != pin", file=sys.stderr)
              sys.exit(1)
          print(f"pin verified: {digest}")
          PY
          # Fresh tokenizer every run: the production embedder requires
          # minilm.onnx AND tokenizer.json in the SAME dir, and a stale
          # tokenizer must never survive under the model-only cache key.
          # The JSON-validity assertion fails LOUDLY on an LFS-pointer
          # checkout instead of surfacing as MODEL_UNAVAILABLE downstream.
          cp skills/memory/models/tokenizer.json "$ZMEM_MODELS_CACHE/tokenizer.json"
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ["ZMEM_MODELS_CACHE"], "tokenizer.json")
          with open(p, "rb") as f:
              head = f.read(64)
          if head.lstrip().startswith(b"version https://git-lfs"):
              print("FATAL: tokenizer.json is an LFS pointer, not the JSON "
                    "(checkout without LFS content?)", file=sys.stderr)
              sys.exit(1)
          json.load(open(p, encoding="utf-8"))
          print("tokenizer.json verified: valid JSON,", os.path.getsize(p), "bytes")
          PY
      - name: Run the frozen #376 contract argvs (real model present)
        shell: bash
        env:
          ZMEM_TEST_REAL_MODELS_DIR: ${{ env.ZMEM_MODELS_CACHE }}
        run: |
          set -e
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_distinct_subjects
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_identity_controls
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_compatible_runner_up
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_all_write_surfaces
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_metadata_integrity
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_compatibility_and_cost
          python -X utf8 -m pytest --disable-plugin-autoload --noconftest -p no:cacheprovider -q tests/test_subject_dedup_contract.py::test_held_out_evaluation

  # Issue #139: C6 is the native Hermes provenance lane. It is separate from
  # the generic Python 3.11 loop because this acceptance fixture must use the
  # real pinned Hermes source and Python 3.14.5. The provider is checked out as
  # CI input; the test itself never installs or downloads it.
  test-source-hermes:
    name: test-source-hermes
    runs-on: ubuntu-latest
    # Successful-run max 1.4 min; 15 = floor covering checkout/install variance.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout zmem
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout pinned Hermes provider
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 00373b537616c96e0ca604b831890a113df07ac0
          path: hermes-agent
          fetch-depth: 1

      - name: Set up Python 3.14.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - name: Install pinned Hermes fixture dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check "ruamel.yaml==0.18.16"

      - name: Run pinned Hermes source acceptance and default-home regressions
        shell: bash
        env:
          ZMEM_TEST_HERMES_PROVIDER_ROOT: ${{ github.workspace }}/hermes-agent
        run: |
          python tests/fixtures/source/repro/checks.py C6 --repo-root .
          python -m unittest -v tests/test_source_hermes_default.py
