name: zmem
version: 0.91.0
description: "ZMem — shared cross-session memory for the whole fleet via one canonical store. MemoryProvider with passive no-bump prefetch + explicit memory tools, plus reflection shell hooks. Provider mode registers post_tool_call, pre_llm_call and pre_verify (issue #163) only when memory.provider=zmem; compatibility mode keeps the shell-hook path. Dual-mode by design: keep Hindsight as memory.provider and run zmem beside it (MCP + prefetch hook); memory.provider: zmem is the local-only exclusive path that displaces Hindsight. Issue #71 A/B."
hooks:
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_session_end
  - on_pre_compress
  - on_memory_write
  - post_tool_call
  - pre_llm_call
  - pre_verify
tags:
  - memory
  - fleet
